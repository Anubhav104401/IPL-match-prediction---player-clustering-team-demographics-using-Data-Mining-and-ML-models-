# ══════════════════════════════════════════════════════════════════════════════
#  IPL Analytics Console — native Streamlit theme
#  Design language: "Stadium Nights" — a deep-space analytics console.
#  Every token here is mirrored in ui/tokens.py so Python-side rendering
#  (Plotly, custom components) stays in lockstep with the widget chrome.
# ══════════════════════════════════════════════════════════════════════════════

[theme]
base = "dark"

# ── Core surfaces ─────────────────────────────────────────────────────────────
backgroundColor          = "#07080F"
secondaryBackgroundColor = "#0E1120"
textColor                = "#E6EAF7"
borderColor              = "#1C2238"
dataframeBorderColor     = "#1C2238"
dataframeHeaderBackgroundColor = "#111528"

# ── Brand ─────────────────────────────────────────────────────────────────────
primaryColor  = "#22D3EE"
linkColor     = "#67E8F9"
linkUnderline = false

# ── Typography ────────────────────────────────────────────────────────────────
font              = "Inter"
headingFont       = "Space Grotesk"
codeFont          = "JetBrains Mono"
baseFontSize      = 15
baseFontWeight    = 400
headingFontSizes  = ["2.75rem", "2rem", "1.375rem", "1.0625rem", "0.9375rem", "0.875rem"]
headingFontWeights = [700, 700, 650, 600, 600, 600]
codeFontSize      = "0.8125rem"
metricValueFontSize = "2.125rem"
metricValueFontWeight = 700

# ── Geometry ──────────────────────────────────────────────────────────────────
baseRadius       = "0.875rem"
buttonRadius     = "0.75rem"
showWidgetBorder = true
showSidebarBorder = false

# ── Chart palettes (drives st.line_chart & friends; Plotly reads ui/tokens) ───
chartCategoricalColors = [
  "#22D3EE", "#A78BFA", "#A3E635", "#FBBF24",
  "#FB7185", "#38BDF8", "#34D399", "#F472B6",
  "#FB923C", "#818CF8",
]
chartSequentialColors = [
  "#0B1B2B", "#0E2E44", "#0F455C", "#0D5D74",
  "#0A768B", "#0790A1", "#0FABB6", "#33C6CA",
  "#6BDFDD", "#A9F2EE",
]
chartDivergingColors = [
  "#7F1D3A", "#A8264A", "#CE3A5B", "#E4657B", "#F0A8AF",
  "#A8DCCB", "#4FC3A1", "#22A67F", "#0D8562", "#08644A",
]

# ── Semantic accents ──────────────────────────────────────────────────────────
greenColor  = "#34D399"
redColor    = "#FB7185"
yellowColor = "#FBBF24"
blueColor   = "#38BDF8"
violetColor = "#A78BFA"
orangeColor = "#FB923C"
grayColor   = "#8B95AF"

greenBackgroundColor  = "#0C2B22"
redBackgroundColor    = "#33111C"
yellowBackgroundColor = "#33270B"
blueBackgroundColor   = "#0C2233"
violetBackgroundColor = "#1F1836"
orangeBackgroundColor = "#331D0C"
grayBackgroundColor   = "#151A2A"

codeBackgroundColor = "#0B0F1D"
codeTextColor       = "#A5F3FC"

[theme.sidebar]
backgroundColor          = "#090B14"
secondaryBackgroundColor = "#111528"
borderColor              = "#171C2E"
textColor                = "#D7DEF0"
primaryColor             = "#22D3EE"
baseRadius               = "0.75rem"
showWidgetBorder         = false

[client]
toolbarMode = "minimal"
showErrorDetails = "full"

[browser]
gatherUsageStats = false

# ══════════════════════════════════════════════════════════════════════════════
#  Web fonts
#  Declared here rather than via an @import in injected CSS: Streamlit's HTML
#  sanitizer drops a <style> block that contains a remote @import, so this is
#  the only reliable way to get non-system faces into the app.
#  Latin + latin-ext subsets only.
# ══════════════════════════════════════════════════════════════════════════════

